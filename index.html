<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>El misterio de Montse · 57</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{position:relative;display:grid;place-items:center;min-height:100svh;overflow:hidden}video{display:block;max-width:100vw;max-height:100svh;width:auto;height:auto;object-fit:contain;background:#000}#intro{position:relative;z-index:1}#loop{position:absolute;z-index:0;opacity:0;pointer-events:none}main.repeating #intro{opacity:0;pointer-events:none}main.repeating #loop{opacity:1;z-index:2}#cover{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#000;text-align:center;padding:24px}h1{font-weight:400;font-size:clamp(23px,5vw,38px);letter-spacing:.09em;margin:0}button{font:inherit;font-size:17px;background:#fff;color:#111;border:0;border-radius:40px;padding:15px 27px;cursor:pointer}small{color:#bbb}#cover.hidden{display:none}#replay{position:absolute;bottom:16px;right:16px;z-index:4;background:#171717aa;color:#fff;border:1px solid #ffffff55;padding:9px 14px;font-size:13px;display:none}main.repeating #replay{display:block}</style></head><body><main id="stage"><video id="intro" playsinline preload="auto" src="MONTSE_57_INTRO_MISTERIO.mp4"></video><video id="loop" playsinline muted loop preload="auto" src="MONTSE_57_BUCLE_LLAMAS.mp4"></video><section id="cover"><h1>Un misterio para Montse…</h1><button id="start">▶ Activa el sonido y dale al play</button></section><button id="replay" aria-label="Volver al principio">↻ Volver a empezar</button></main><script>const stage=document.getElementById('stage'),intro=document.getElementById('intro'),loop=document.getElementById('loop'),cover=document.getElementById('cover'),start=document.getElementById('start'),replay=document.getElementById('replay');let switched=false;function reveal(){if(switched)return;switched=true;loop.currentTime=0;loop.play().then(()=>{stage.classList.add('repeating');intro.pause()}).catch(()=>{stage.classList.add('repeating');loop.controls=true;intro.pause()})}start.addEventListener('click',async()=>{cover.classList.add('hidden');try{await intro.play()}catch(e){cover.classList.remove('hidden');start.textContent='▶ Toca para reproducir'}});intro.addEventListener('ended',reveal);replay.addEventListener('click',()=>{switched=false;loop.pause();stage.classList.remove('repeating');intro.currentTime=0;intro.play().catch(()=>{cover.classList.remove('hidden')})});</script></body></html>
